apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: employeeui-service
            port:
              number: 80

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: employeeapi-service
            port:
              number: 80