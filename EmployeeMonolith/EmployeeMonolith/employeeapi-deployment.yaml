apiVersion: apps/v1
kind: Deployment
metadata:
  name: employeeapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employeeapi
  template:
    metadata:
      labels:
        app: employeeapi
    spec:
      nodeSelector:
        kubernetes.io/os: windows
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: employeeapi
        image: bhargavacr001.azurecr.io/employeeapi:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: employeeapi-service
spec:
  type: LoadBalancer
  selector:
    app: employeeapi
  ports:
  - port: 80
    targetPort: 80